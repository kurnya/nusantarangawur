name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tentukan base path
        # Repo USERNAME.github.io disajikan di root; repo lain di /NAMA-REPO/
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "VITE_BASE=/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: npm run build
        env:
          # Opsional (saat ini kosong = tanpa TURN). Isi di Settings > Secrets and variables > Actions > Variables
          VITE_ICE_SERVERS: ${{ vars.VITE_ICE_SERVERS }}
          VITE_ICE_SERVERS_URL: ${{ vars.VITE_ICE_SERVERS_URL }}
      - name: Salin index.html jadi 404.html (untuk tautan #/join/...)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
